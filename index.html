<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>공유 캐릭터 갤러리</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<style>
body {
  font-family: sans-serif;
}

.character {
  border: 1px solid #ccc;
  margin: 10px;
  padding: 10px;
}


img {
  width: 120px;
  margin: 5px;
  cursor: pointer;
}
</style>
</head>

<body>

<h2>캐릭터 추가</h2>
<input type="text" id="charName" placeholder="캐릭터 이름">
<button onclick="addCharacter()">추가</button>

<hr>

<div id="gallery"></div>

<script>
// 🔥 여기에 네 Firebase 설정 넣기
const firebaseConfig = {
  apiKey: "AIzaSyD7ygE4TYBnAqgSdsLbGSnrfxuPZhfspEw",
  authDomain: "kimchistew-99.firebaseapp.com",
  projectId: "kimchistew-99",
};

// 초기화
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// 🔹 캐릭터 추가
async function addCharacter() {
  const name = document.getElementById("charName").value;
  if (!name) return;

  await db.collection("characters").add({
    name: name,
    images: []
  });

  document.getElementById("charName").value

 = "";
}

// 🔹 이미지 링크 추가
async function addImage(id) {
  const url = prompt("이미지 링크를 붙여넣어!");

  if (!url) return;

  const docRef = db.collection("characters").doc(id);
  const doc = await docRef.get();

  const data = doc.data();
  data.images.push(url);

  await docRef.update({ images: data.images });
}

// 🔹 캐릭터 삭제
async function deleteCharacter(id) {
  await db.collection("characters").doc(id).delete();

}

// 🔹 실시간 렌더링
db.collection("characters").onSnapshot(snapshot => {
  const gallery = document.getElementById("gallery");
  gallery.innerHTML = "";

  snapshot.forEach(doc => {
    const data = doc.data();

    const div = document.createElement("div");
    div.className = "character";

    div.innerHTML = `
      <h3>${data.name}</h3>
      <button onclick="addImage('${doc.id}')">이미지 추가</button>
      <button onclick="deleteCharacter('${doc.id}')">삭제</button>
      <div>
        ${data.images.map(img => `

          <img src="${img}" onclick="openModal('${img}')">
        `).join("")}
      </div>
    `;

    gallery.appendChild(div);
  });
});

// 🔥 확대 보기
let currentImage = "";

function openModal(src) {
  currentImage = src;
  document.getElementById("modal").style.display = "flex";
  document.getElementById("modalImg").src = src;
}

function closeModal() {
  

document.getElementById("modal").style.display = "none";
}
</script>

<!-- 🔥 확대 UI -->
<div id="modal" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
justify-content:center;
align-items:center;
flex-direction:column;
">

  <img id="modalImg" style="max-width:80%; max-height:80%;">
  <br>
  <button onclick="closeModal()">닫기</button>

</div>

</body>
</html>
